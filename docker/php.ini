; Producción
expose_php = Off
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 25M

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; El código vive en la imagen: cada despliegue crea un contenedor nuevo y vacía opcache.
opcache.validate_timestamps = 0
